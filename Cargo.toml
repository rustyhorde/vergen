[workspace]
resolver = "2"

members = [
    "test_util",
    "vergen",
    "vergen-git2",
    "vergen-gitcl",
    "vergen-gix",
    "vergen-lib",
    "vergen-pretty",
]

[workspace.dependencies]
anyhow = "1.0.104"
bon = "3.9.3"
gix = { version = "0.86.0", default-features = false, features = [
    "revision",
    "worktree-mutation",
    "blocking-network-client",
    "sha1",
] }
rand = { version = "0.10.2" }
regex = { version = "1.13.1" }
rustversion = "1.0.23"
serde_json = "1.0.151"
serial_test = "4.0.1"
temp-env = "0.3.6"
time = { version = "0.3.55", features = [
    "formatting",
    "local-offset",
    "parsing",
] }
